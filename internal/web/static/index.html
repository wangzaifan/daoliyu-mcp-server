<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>道理鱼 MCP 服务</title><link rel="stylesheet" href="/assets/style.css"><link rel="stylesheet" href="/assets/layout.css"><link rel="stylesheet" href="/assets/config.css"></head>
<body>
<main class="shell">
  <header><div class="brand"><img src="/assets/icon.png" alt="道理鱼"><div><h1>道理鱼 MCP 服务</h1><p>独立端口 · 可插拔 MCP 平台</p></div></div><div class="actions"><a class="icon-button" href="https://github.com/wangzaifan/daoliyu-mcp-server" target="_blank" rel="noreferrer" aria-label="打开 GitHub 开源仓库" title="GitHub 开源仓库"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 .5a12 12 0 0 0-3.79 23.39c.6.11.82-.26.82-.58v-2.03c-3.34.73-4.04-1.61-4.04-1.61-.55-1.4-1.34-1.77-1.34-1.77-1.09-.75.08-.74.08-.74 1.2.08 1.84 1.23 1.84 1.23 1.07 1.83 2.8 1.3 3.48.99.11-.77.42-1.3.76-1.6-2.67-.3-5.47-1.34-5.47-5.95 0-1.31.47-2.38 1.23-3.22-.12-.3-.53-1.52.12-3.18 0 0 1-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.3-1.55 3.3-1.23 3.3-1.23.65 1.66.24 2.88.12 3.18.76.84 1.23 1.91 1.23 3.22 0 4.62-2.8 5.64-5.48 5.94.43.37.81 1.1.81 2.22v3.29c0 .32.22.69.83.57A12 12 0 0 0 12 .5Z"/></svg></a><button class="icon-button settings-button" id="settingsBtn" type="button" aria-label="打开设置" title="设置"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="m19.4 15 .1.1a2 2 0 1 1-2.8 2.8l-.1-.1a2 2 0 0 0-3.4 1.4V19a2 2 0 1 1-4 0v-.2a2 2 0 0 0-3.4-1.4l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A2 2 0 0 0 1.6 11H1.5a2 2 0 1 1 0-4h.2a2 2 0 0 0 1.4-3.4L3 3.5A2 2 0 1 1 5.8.7l.1.1A2 2 0 0 0 9.3-.6V-.8a2 2 0 1 1 4 0v.2a2 2 0 0 0 3.4 1.4l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A2 2 0 0 0 20.9 7h.1a2 2 0 1 1 0 4h-.2a2 2 0 0 0-1.4 3.4Z"/></svg><span class="update-dot" id="updateDot" hidden></span></button></div></header>
  <section class="notice" id="notice"></section>
  <section class="toolbar"><div><h2>MCP 接入</h2><p class="muted">这里管理接入道理鱼的 MCP 连接；思源本体仍在思源 FPK 内安装和运行。</p></div><span id="tokenHint" class="muted"></span></section>
  <section id="cards" class="cards"></section>
</main>
<dialog id="settingsDialog"><div class="panel settings-panel"><div class="panel-head"><div><h2>设置</h2><p>管理入口和版本信息。</p></div><button class="icon-button" type="button" id="closeSettings" aria-label="关闭设置" title="关闭"><span aria-hidden="true">×</span></button></div><div class="settings-list"><a href="/tokens"><span class="settings-icon">♢</span><span><strong>Token 管理</strong><small>创建调用凭据并限制可用能力</small></span></a><button id="uploadMenu" type="button"><span class="settings-icon">⇧</span><span><strong>安装插件包</strong><small>安装符合平台规范的 ZIP 插件包</small></span></button><button id="aboutBtn" type="button"><span class="settings-icon">ⓘ</span><span><strong>关于与更新</strong><small>查看版本和更新检测状态</small></span></button></div></div></dialog>
<dialog id="pluginDialog"><div class="panel"><div class="panel-head"><div><h2 id="pluginConfigTitle">插件配置</h2><p id="pluginConfigHelp">配置保存在该插件自己的命名空间内。</p></div><button class="icon-button" type="button" id="closePlugin" aria-label="关闭配置" title="关闭"><span aria-hidden="true">×</span></button></div><form id="pluginSettings"></form></div></dialog>
<dialog id="toolDialog"><div class="panel"><div class="panel-head"><div><h2 id="toolDialogTitle">能力详情</h2><p id="toolDialogSummary">查看插件当前公开的 MCP 能力。</p></div><button class="icon-button" type="button" id="closeTools" aria-label="关闭能力详情" title="关闭"><span aria-hidden="true">×</span></button></div><div id="toolList" class="tool-list"></div></div></dialog>
<dialog id="aboutDialog"><div class="panel"><div class="panel-head"><div><h2>关于道理鱼 MCP 服务</h2><p>版本和更新状态</p></div><button class="icon-button" type="button" id="closeAbout" aria-label="关闭关于" title="关闭"><span aria-hidden="true">×</span></button></div><div class="about-list"><div><span>当前版本</span><strong id="currentVersion">读取中…</strong></div><div><span>最新检测版本</span><strong id="latestVersion">尚未检测</strong></div><p id="updateSource" class="muted"></p></div><div class="dialog-actions"><button class="primary" id="checkUpdate" type="button">检查更新</button></div></div></dialog>
<input id="file" type="file" accept=".zip" hidden>
<script src="/assets/app.js"></script>
</body></html>
